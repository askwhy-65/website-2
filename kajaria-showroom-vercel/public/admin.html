<!DOCTYPE html>
<html lang="en-IN">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <meta content="noindex,nofollow" name="robots"/>
  <title>
   Enquiry Admin | Kajaria Shop
  </title>
  <link href="/assets/favicon.svg" rel="icon" type="image/svg+xml"/>
  <link href="/assets/site.css" rel="stylesheet"/>
  <script defer="" src="/assets/admin.js">
  </script>
 </head>
 <body>
  <main class="admin-shell">
   <div class="container">
    <a class="text-link" href="/">
     ← Back to website
    </a>
    <section class="admin-card" id="login-card">
     <span class="eyebrow">
      Private dashboard
     </span>
     <h1>
      Enquiry inbox
     </h1>
     <p>
      Sign in with the admin credentials configured in Vercel Environment Variables.
     </p>
     <form id="login-form">
      <div class="field">
       <label for="username">
        Username
       </label>
       <input autocomplete="username" id="username" name="username" required=""/>
      </div>
      <div class="field" style="margin-top:14px">
       <label for="password">
        Password
       </label>
       <input autocomplete="current-password" id="password" name="password" required="" type="password"/>
      </div>
      <button class="btn btn-primary" style="margin-top:18px" type="submit">
       Sign in
      </button>
      <p class="form-message" id="login-message" role="status">
      </p>
     </form>
    </section>
    <section class="hide" id="dashboard">
     <div class="admin-bar">
      <div>
       <span class="eyebrow">
        Private dashboard
       </span>
       <h1 style="font-size:2.3rem;margin:8px 0">
        Website enquiries
       </h1>
       <p>
        Review and update enquiry status. Keep this dashboard private.
       </p>
      </div>
      <button class="btn btn-outline" id="logout">
       Sign out
      </button>
     </div>
     <div class="lead-list" id="leads">
      <div class="empty-state">
       Loading enquiries…
      </div>
     </div>
    </section>
   </div>
  </main>
 </body>
</html>
